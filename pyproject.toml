[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maio-tower"
version = "0.1.0"
description = "Data and helpers for MAIO Project 1: flux mast temperature sensors (Utrecht University)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = ["jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["src/maio_tower"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "maio_tower/data"

[tool.hatch.build.targets.sdist]
include = ["src/maio_tower", "data", "README.md"]
