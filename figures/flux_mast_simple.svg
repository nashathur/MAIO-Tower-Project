<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1220" viewBox="0 0 800 1220" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <g id="shield">
      <rect x="-15" y="-22" width="30" height="22" rx="3" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
      <line x1="-15" y1="-16.5" x2="15" y2="-16.5" stroke="#c0392b" stroke-width="1.6"/>
      <line x1="-15" y1="-11" x2="15" y2="-11" stroke="#c0392b" stroke-width="1.6"/>
      <line x1="-15" y1="-5.5" x2="15" y2="-5.5" stroke="#c0392b" stroke-width="1.6"/>
    </g>
    <g id="vane">
      <line x1="-20" y1="0" x2="18" y2="0" stroke="#1d4ed8" stroke-width="3.5"/>
      <path d="M-20,0 L-30,-10 L-30,10 Z" fill="#1d4ed8"/>
      <ellipse cx="20" cy="0" rx="3.5" ry="12" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#1d4ed8"/>
    </g>
    <g id="vanef">
      <line x1="-20" y1="0" x2="18" y2="0" stroke="#be185d" stroke-width="3.5"/>
      <path d="M-20,0 L-30,-10 L-30,10 Z" fill="#be185d"/>
      <ellipse cx="20" cy="0" rx="3.5" ry="12" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#be185d"/>
    </g>
    <g id="sonic">
      <line x1="0" y1="0" x2="-10" y2="0" stroke="#0f766e" stroke-width="4"/>
      <path d="M-10,0 L-34,-19 M-10,0 L-34,19 M-10,0 L-40,0" stroke="#0f766e" stroke-width="3" fill="none"/>
      <rect x="-41" y="-25" width="11" height="10" rx="2" fill="#0f766e"/>
      <rect x="-41" y="15" width="11" height="10" rx="2" fill="#0f766e"/>
      <circle cx="-40" cy="0" r="4" fill="#0f766e"/>
    </g>
    <g id="iws"><rect x="-18" y="-12" width="36" height="24" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><circle cx="0" cy="0" r="4" fill="#ea580c"/></g>
    <g id="cnr"><rect x="-16" y="-4" width="32" height="8" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><ellipse cx="0" cy="-7" rx="7" ry="4" fill="#7c3aed"/></g>
  </defs>

  <rect width="800" height="1220" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#111827">MAIO flux mast</text>
  <text x="40" y="80" font-size="16" fill="#4b5563">Utrecht Science Park · sensor heights above ground</text>

  <!-- height axis: 1 m = 100 px, ground at y = 860 -->
  <g font-size="13" fill="#9ca3af" stroke="#d1d5db">
    <line x1="80" y1="860" x2="80" y2="160"/>
    <line x1="74" y1="860" x2="86" y2="860"/><line x1="74" y1="760" x2="86" y2="760"/><line x1="74" y1="660" x2="86" y2="660"/><line x1="74" y1="560" x2="86" y2="560"/>
    <line x1="74" y1="460" x2="86" y2="460"/><line x1="74" y1="360" x2="86" y2="360"/><line x1="74" y1="260" x2="86" y2="260"/><line x1="74" y1="160" x2="86" y2="160"/>
    <g stroke="none" text-anchor="end">
      <text x="66" y="865">0 m</text><text x="66" y="765">1 m</text><text x="66" y="665">2 m</text><text x="66" y="565">3 m</text>
      <text x="66" y="465">4 m</text><text x="66" y="365">5 m</text><text x="66" y="265">6 m</text><text x="66" y="165">7 m</text>
    </g>
  </g>

  <!-- ground -->
  <rect x="95" y="860" width="670" height="20" fill="#dcfce7"/>
  <line x1="95" y1="860" x2="765" y2="860" stroke="#4d7c0f" stroke-width="3"/>
  <g stroke="#65a30d" stroke-width="2">
    <path d="M130,860 l-4,-9 M136,860 l2,-10 M300,860 l-4,-9 M306,860 l2,-10 M600,860 l-4,-9 M606,860 l2,-10 M720,860 l-4,-9 M726,860 l2,-10"/>
  </g>

  <!-- mast -->
  <rect x="374" y="131" width="12" height="729" rx="2" fill="#9ca3af"/>

  <!-- T/RH booms (left) and sonic -->
  <g stroke="#374151" stroke-width="4" stroke-linecap="round">
    <line x1="270" y1="829" x2="374" y2="829"/>
    <line x1="270" y1="764" x2="374" y2="764"/>
    <line x1="270" y1="669" x2="374" y2="669"/>
    <line x1="270" y1="477.5" x2="374" y2="477.5"/>
    <line x1="320" y1="159.5" x2="374" y2="159.5"/>
    <line x1="305" y1="556.5" x2="374" y2="556.5"/>
  </g>
  <use href="#shield" x="270" y="829"/>
  <use href="#shield" x="270" y="764"/>
  <use href="#shield" x="270" y="669"/>
  <use href="#shield" x="270" y="477.5"/>
  <use href="#shield" x="320" y="159.5"/>
  <use href="#sonic" x="305" y="556.5"/>

  <g font-size="19" font-weight="700" text-anchor="end" fill="#c0392b">
    <text x="243" y="824">0.4 m</text>
    <text x="243" y="759">1.0 m</text>
    <text x="243" y="664">2.0 m</text>
    <text x="243" y="472">3.9 m</text>
    <text x="293" y="154">7.0 m</text>
  </g>
  <text x="250" y="563" font-size="19" font-weight="700" text-anchor="end" fill="#0f766e">3.0 m</text>

  <!-- wind booms (right) -->
  <g stroke="#374151" stroke-width="4" stroke-linecap="round">
    <line x1="386" y1="829" x2="500" y2="829"/><line x1="500" y1="829" x2="500" y2="802.5"/>
    <line x1="386" y1="764" x2="500" y2="764"/><line x1="500" y1="764" x2="500" y2="735"/>
    <line x1="386" y1="669" x2="500" y2="669"/><line x1="500" y1="669" x2="500" y2="642"/>
    <line x1="386" y1="477.5" x2="500" y2="477.5"/><line x1="500" y1="477.5" x2="500" y2="448"/>
    <line x1="386" y1="133" x2="440" y2="133"/>
  </g>
  <use href="#vane" x="500" y="802.5"/>
  <use href="#vane" x="500" y="735"/>
  <use href="#vane" x="500" y="642"/>
  <use href="#vane" x="500" y="448"/>
  <use href="#vane" x="440" y="124"/>
  <g font-size="19" font-weight="700" fill="#1d4ed8">
    <text x="536" y="809">0.6 m</text>
    <text x="536" y="741">1.25 m</text>
    <text x="536" y="648">2.2 m</text>
    <text x="536" y="454">4.1 m</text>
    <text x="476" y="130">7.3 m</text>
  </g>

  <!-- fast vane beside the sonic -->
  <line x1="386" y1="565" x2="450" y2="565" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="450" y1="565" x2="450" y2="546" stroke="#374151" stroke-width="3"/>
  <use href="#vanef" x="450" y="540"/>
  <text x="486" y="547" font-size="19" font-weight="700" fill="#be185d">3.0 m</text>

  <!-- CNR1 on the 4 m crossbar -->
  <use href="#cnr" x="445" y="481"/>
  <text x="445" y="504" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">CNR1</text>

  <!-- side booms at ~4 m -->
  <line x1="386" y1="485" x2="500" y2="322" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="386" cy="485" r="5" fill="#ea580c"/>
  <rect x="480" y="186" width="290" height="136" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="625" y="212" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Side booms at ≈ 4 m</text>
  <line x1="500" y1="252" x2="750" y2="252" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <use href="#iws" x="540" y="252"/>
  <line x1="625" y1="252" x2="625" y2="236" stroke="#374151" stroke-width="3"/>
  <use href="#vane" x="625" y="230"/>
  <use href="#cnr" x="715" y="260"/>
  <text x="498" y="287" font-size="14" fill="#374151">SW: <tspan fill="#ea580c" font-weight="700">iWS 3.75 m</tspan>, vane, <tspan fill="#7c3aed" font-weight="700">CNR4</tspan></text>
  <text x="498" y="309" font-size="14" fill="#374151"><tspan fill="#7c3aed" font-weight="700">CNR1</tspan>: end of the 4 m crossbar</text>

  <!-- legend, two columns below the mast -->
  <text x="40" y="922" font-size="19" font-weight="700" fill="#111827">Instruments</text>

  <use href="#shield" x="70" y="967"/>
  <text x="110" y="955" font-size="17" font-weight="700" fill="#c0392b">Air temperature and humidity</text>
  <text x="110" y="976" font-size="13.5" fill="#4b5563">Vaisala HMP110, ventilated shield · 5 levels</text>

  <use href="#vane" x="70" y="1033"/>
  <text x="110" y="1032" font-size="17" font-weight="700" fill="#1d4ed8">Wind speed and direction</text>
  <text x="110" y="1053" font-size="13.5" fill="#4b5563">Young 05103 propeller vane · 5 levels</text>

  <use href="#vanef" x="70" y="1110"/>
  <text x="110" y="1109" font-size="17" font-weight="700" fill="#be185d">Fast propeller vane</text>
  <text x="110" y="1130" font-size="13.5" fill="#4b5563">Young vane sampled at 10 Hz, beside the sonic</text>

  <use href="#sonic" x="460" y="960"/>
  <text x="480" y="955" font-size="17" font-weight="700" fill="#0f766e">Sonic + thermocouple</text>
  <text x="480" y="976" font-size="13.5" fill="#4b5563">CSAT3 · fast (10 Hz) wind and temperature</text>

  <use href="#iws" x="440" y="1037"/>
  <text x="480" y="1032" font-size="17" font-weight="700" fill="#ea580c">iWS weather station</text>
  <text x="480" y="1053" font-size="13.5" fill="#4b5563">Unventilated T, RH, wind, pressure</text>

  <use href="#cnr" x="440" y="1114"/>
  <text x="480" y="1109" font-size="17" font-weight="700" fill="#7c3aed">Net radiometers</text>
  <text x="480" y="1130" font-size="13.5" fill="#4b5563">CNR1 and CNR4 · SW and LW, in and out</text>

  <text x="40" y="1182" font-size="13" fill="#6b7280">Heights measured on site, rounded. Vertical scale true, horizontal not to scale.</text>
</svg>
